<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bóveda Digital - MedVault</title>
</head>
<script>
    // Sincronización inmediata de MedVault para evitar "flash" de colores
    (function() {
        const tema = localStorage.getItem('medvault-tema');
        if (tema === 'azul') {
            document.documentElement.classList.add('tema-azul');
        } else if (tema === 'verde') {
            document.documentElement.classList.add('tema-verde');
        } else if (tema === 'amarillo') {
            document.documentElement.classList.add('tema-amarillo');
        }
    })();

    window.addEventListener('DOMContentLoaded', () => {
        const tema = localStorage.getItem('medvault-tema');
        if (tema === 'azul') {
            document.body.classList.add('tema-azul');
        } else if (tema === 'verde') {
            document.body.classList.add('tema-verde');
        } else if (tema === 'amarillo') {
            document.body.classList.add('tema-amarillo');
        }
    });
</script>
<script>
    (function() {
        const tema = localStorage.getItem('medvault-tema');
        if (tema) {
            document.documentElement.classList.add('tema-' + tema);
        }
    })();
</script>
<body>
    <div id="bg-container"></div>

    <div class="app-container">
        <h3 style="color: #5D8AA8;">Bóveda Digital 🍓</h3>
        
        <div class="section-card" style="margin-bottom: 15px;">
            <p style="margin-bottom: 10px; font-weight: bold;">Subir Escaneo o Estudio</p>
            <input type="file" id="camaraInput" accept="image/*" capture="camera" style="display:none">
            <button class="btn-main" onclick="document.getElementById('camaraInput').click()">📷 Tomar Foto / Subir</button>
        </div>

        <div class="section-card" style="margin-bottom: 20px; background: rgba(255,255,255,0.8);">
            <p style="margin-bottom: 10px; font-weight: bold;">Registrar Receta Médica 💊</p>
            <input type="text" id="receta-medicamento" placeholder="Medicamento" class="input-field" style="width: 90%; margin-bottom: 8px; padding: 8px;">
            <input type="text" id="receta-indicaciones" placeholder="Indicaciones (ej. cada 8 horas)" class="input-field" style="width: 90%; margin-bottom: 8px; padding: 8px;">
            <input type="text" id="receta-medico" placeholder="Nombre del Médico" class="input-field" style="width: 90%; margin-bottom: 10px; padding: 8px;">
            <button class="btn-main" id="btnGuardarReceta" style="background: #FFB7CE; border: none; border-radius: 20px;">Guardar Receta ✨</button>
        </div>

        <hr style="border: 0; height: 1px; background: #5D8AA8; margin: 20px 0;">

        <h3 style="color: #5D8AA8; font-size: 1.1em;">Mi Historial Digital</h3>
        <div id="contenedor-boveda">
            <p style="text-align: center; color: #888;">Cargando tus documentos y recetas... 🍓</p>
        </div>
        
        <button id="btnVolver" class="btn-main" style="background:#eee; color:#666; margin-top:20px;" onclick="location.href='dashboard_paciente.html'">Volver al Panel</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCREOGSVefLZtxn86NOWPVlqaNLCwthLYM",
            authDomain: "medvault-8c504.firebaseapp.com",
            projectId: "medvault-8c504",
            storageBucket: "medvault-8c504.firebasestorage.app",
            messagingSenderId: "618891803915",
            appId: "1:618891803915:web:04942cc8e76967dff7b60e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const nombrePaciente = localStorage.getItem('usuario-nombre');

        async function cargarBoveda() {
            const contenedor = document.getElementById('contenedor-boveda');
            if (!nombrePaciente) return;

            try {
                let htmlFinal = "";
                const nombreLimpio = nombrePaciente.trim();

                // 1. Cargar Recetas (las del doctor y las que subió el paciente)
                const qRecetas = query(collection(db, "recetas"), where("paciente_nombre", "==", nombreLimpio));
                const snapRecetas = await getDocs(qRecetas);
                
                snapRecetas.forEach(doc => {
                    const r = doc.data();
                    htmlFinal += `
                        <div class="section-card" style="border-left: 5px solid #FFB7CE; text-align: left; margin-bottom: 10px; background: #fffafa; padding: 10px;">
                            <p style="margin:0;"><strong>💊 Receta:</strong> ${r.medicamento}</p>
                            <p style="margin:0; font-size:0.85em; color:#666;">📝 ${r.indicaciones}</p>
                            <p style="margin:0; font-size:0.75em; color:#999;">Dr. ${r.medico_nombre || 'No especificado'}</p>
                        </div>`;
                });

                // 2. Cargar Documentos/Escaneos
                const qDocs = query(collection(db, "boveda_paciente"), where("paciente_nombre", "==", nombreLimpio));
                const snapDocs = await getDocs(qDocs);

                snapDocs.forEach(doc => {
                    const d = doc.data();
                    htmlFinal += `
                        <div class="section-card" style="border-left: 5px solid #5D8AA8; text-align: left; margin-bottom: 10px; padding: 10px;">
                            <p style="margin:0;"><strong>📄 Escaneo:</strong> ${d.nombre_archivo}</p>
                            <a href="${d.url_archivo}" target="_blank" style="font-size:0.8em; color:#5D8AA8; font-weight:bold;">Ver documento ↗</a>
                        </div>`;
                });

                contenedor.innerHTML = htmlFinal || `<p style="text-align:center; color:#999;">Aún no tienes nada en tu bóveda 🍓</p>`;

            } catch (e) { 
                console.error(e);
                contenedor.innerHTML = "Error al sincronizar datos."; 
            }
        }

        // --- LÓGICA PARA GUARDAR RECETA MANUALMENTE ---
        document.getElementById('btnGuardarReceta').addEventListener('click', async () => {
            const med = document.getElementById('receta-medicamento').value;
            const ind = document.getElementById('receta-indicaciones').value;
            const docNombre = document.getElementById('receta-medico').value;

            if (!med || !ind) {
                alert("Por favor escribe el medicamento y las indicaciones ✨");
                return;
            }

            try {
                await addDoc(collection(db, "recetas"), {
                    paciente_nombre: nombrePaciente.trim(),
                    medicamento: med,
                    indicaciones: ind,
                    medico_nombre: docNombre || "Personal",
                    fecha: new Date().toLocaleDateString(),
                    timestamp: Timestamp.now()
                });
                alert("Receta guardada en tu historial 🍓");
                // Limpiar campos
                document.getElementById('receta-medicamento').value = "";
                document.getElementById('receta-indicaciones').value = "";
                document.getElementById('receta-medico').value = "";
                cargarBoveda();
            } catch (e) { console.error(e); }
        });

        // --- LÓGICA PARA SUBIR ARCHIVOS/FOTOS ---
        const camaraInput = document.getElementById('camaraInput');
        camaraInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && nombrePaciente) {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    await addDoc(collection(db, "boveda_paciente"), {
                        paciente_nombre: nombrePaciente.trim(),
                        nombre_archivo: file.name,
                        url_archivo: event.target.result,
                        fecha_subida: Timestamp.now()
                    });
                    alert("¡Documento guardado con éxito! ✨");
                    cargarBoveda();
                };
                reader.readAsDataURL(file);
            }
        });

        cargarBoveda();
    </script>
</body>
</html>
