<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Médico</title>
</head>
<body>

    <div class="app-container">
        <h3>Acceso Médico</h3>
        <form method="POST">
            <input type="text" name="cedula" placeholder="Cédula Profesional" required>
            <input type="text" name="id_institucion" placeholder="Código de Institución" required>
            <input type="password" name="pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-main">Validar y Entrar</button>
        </form>

        <div class="registro-container">
            <p style="font-size: 0.8rem; margin-top: 20px; margin-bottom: 5px;">¿Aún no tienes perfil profesional?</p>
            <button class="btn-mini" onclick="location.href='registro_medico.html'">Crear Perfil Médico</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
