<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Emitir Receta - MedVault</title>
</head>
<body>
    <div class="app-container">
        <h3>Nueva Receta Digital</h3>
        <div class="section-card" style="text-align: left;">
            <label><small>Medicamento y Dosis:</small></label>
            <input type="text" placeholder="Ej: Paracetamol 500mg">
            <label><small>Indicaciones:</small></label>
            <input type="text" placeholder="Tomar cada 8 horas">
            <label><small>Duracion:</small></label>
            <input type="text" placeholder="5 dias">
            <button class="btn-main" onclick="alert('Receta enviada a la Boveda del paciente')">Emitir y Firmar</button>
        </div>
        <button class="btn-main" onclick="location.href='dashboard_medico.html'">Cancelar</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
