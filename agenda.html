<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Agenda MedVault</title>
</head>
<body>
    <div class="app-container">
        <h3>Agenda de Citas</h3>
        
        <div class="section-card">
            <h4>Proxima Cita</h4>
            <p><strong>Fecha:</strong> 20 de Abril</p>
            <p><strong>Hora:</strong> 10:30 AM</p>
            <p><strong>Doctor:</strong> Garcia (Medicina General)</p>
        </div>

        <div id="modulo-agendar">
            <h4>Agendar Nueva Cita</h4>
            <input type="date">
            <input type="time">
            <input type="text" placeholder="Nombre del Paciente">
            <button class="btn-main">Confirmar Cita</button>
        </div>

        <button class="btn-main" style="background: var(--accent-color);" onclick="history.back()">Volver</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
