<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MedVault - Inicio</title>
</head>
<body>
    <a href="configuracion.html" class="settings-icon">⚙️</a>

    <div class="app-container">
        <h1 style="font-size: 1.8rem; margin-bottom: 5px;">MedVault</h1>
        <p style="font-size: 0.9rem; margin-bottom: 25px;">Tu bóveda médica digital</p>

        <div class="main-access">
            <div class="access-column">
                <button class="btn-main" onclick="location.href='login_paciente.html'">PACIENTE</button>
            </div>
            <div class="access-column">
                <button class="btn-main" onclick="location.href='login_medico.html'">MÉDICO</button>
            </div>
        </div>

        <div class="section-card">
            <h4 style="margin-top: 0;">Servicios Públicos</h4>
            <button class="btn-main" style="margin-bottom: 15px;" onclick="location.href='directorio.html'">
                Doctores y Hospitales
            </button>
            
            <div style="display: flex; gap: 8px; background: var(--input-bg); padding: 5px; border-radius: 12px;">
                <input type="text" placeholder="Buscar especialidad..." style="margin:0; background:none; padding: 10px;">
                <button style="border:none; background:none; cursor:pointer; padding: 0 10px;">🔍</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
