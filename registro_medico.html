
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Registro Médico</title>
</head>
<body>
    <div class="app-container">
        <h3>Registro de Médico</h3>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="text" name="cedula" placeholder="Cédula Profesional" required>
            <input type="email" name="correo" placeholder="Correo Institucional" required>
            <input type="password" name="pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-main">Crear Perfil Médico</button>
        </form>
    </div>
</body>
</html>
