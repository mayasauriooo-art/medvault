<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>MedVault - Registro Médico</title>
    <link rel="stylesheet" href="style.css">
    <script>
    // Sincronización inmediata de MedVault para evitar "flash" de colores
    (function() {
        const tema = localStorage.getItem('medvault-tema');
        if (tema === 'azul') {
            document.documentElement.classList.add('tema-azul');
        } else if (tema === 'verde') {
            document.documentElement.classList.add('tema-verde');
        } else if (tema === 'amarillo') {
            document.documentElement.classList.add('tema-amarillo');
        }
    })();

    window.addEventListener('DOMContentLoaded', () => {
        const tema = localStorage.getItem('medvault-tema');
        if (tema === 'azul') {
            document.body.classList.add('tema-azul');
        } else if (tema === 'verde') {
            document.body.classList.add('tema-verde');
        } else if (tema === 'amarillo') {
            document.body.classList.add('tema-amarillo');
        }
    });
</script>
<script>
    (function() {
        const tema = localStorage.getItem('medvault-tema');
        if (tema) {
            document.documentElement.classList.add('tema-' + tema);
        }
    })();
</script>
</head>
<body>
    <div class="app-container">
        <h2 class="logo-text" style="color: #5D8AA8; margin-bottom: 20px;">Registro de Médico</h2>
        
        <div class="section-card">
            <input type="text" id="regNombre" placeholder="Nombre completo" class="input-custom">
            <input type="text" id="regCedula" placeholder="Cédula Profesional" class="input-custom">
            <input type="text" id="regInstitucion" placeholder="Código de Institución" class="input-custom">
            <input type="email" id="regCorreo" placeholder="Correo Institucional" class="input-custom">
            <input type="password" id="regPass" placeholder="Contraseña" class="input-custom">
            
            <button id="btnRegistrar" class="btn-main" style="background-color: var(--button-color); color: white; margin-top: 15px;">
                Crear Perfil Médico
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCREOGSVefLZtxn86NOWPVlqaNLCwthLYM",
            authDomain: "medvault-8c504.firebaseapp.com",
            projectId: "medvault-8c504",
            storageBucket: "medvault-8c504.firebasestorage.app",
            messagingSenderId: "618891803915",
            appId: "1:618891803915:web:04942cc8e76967dff7b60e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btnRegistrar').addEventListener('click', async () => {
            const nombre = document.getElementById('regNombre').value.trim();
            const cedula = document.getElementById('regCedula').value.trim();
            const institucion = document.getElementById('regInstitucion').value.trim();
            const correo = document.getElementById('regCorreo').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (!nombre || !cedula || !institucion || !correo || !pass) {
                alert("Por favor, llena todos los campos con destellos ✨");
                return;
            }

            try {
                // LIMPIEZA: Borramos cualquier rastro de sesión anterior al registrar un médico nuevo
                localStorage.clear();

                await addDoc(collection(db, "medicos"), {
                    nombre: nombre,
                    cedula: cedula,
                    institucion: institucion,
                    correo: correo,
                    password: pass,
                    tipo: "medico",
                    especialidad: "General", 
                    fechaRegistro: new Date().toLocaleDateString()
                });

                alert("¡Perfil médico creado! Ya puedes entrar 🍓");
                location.href = 'login_medico.html';

            } catch (e) {
                console.error("Error: ", e);
                alert("Hubo un error al conectar con la bóveda.");
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
