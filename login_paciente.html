<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Paciente</title>
</head>
<body>

    <div class="app-container">
        <h3>Acceso Paciente</h3>
        <form method="POST">
            <input type="email" name="correo" placeholder="Correo Electrónico" required>
            <input type="password" name="pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-main">Entrar</button>
        </form>

        <div class="registro-container">
            <p style="font-size: 0.8rem; margin-top: 20px; margin-bottom: 5px;">¿Eres nuevo en MedVault?</p>
            <button class="btn-mini" onclick="location.href='registro_paciente.html'">Crear Cuenta de Paciente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
