<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Agendar Cita - MedVault</title>
</head>
<body>
    <div class="app-container">
        <h3>Agendar Nueva Consulta</h3>
        <div class="section-card">
            <form>
                <input type="text" placeholder="Nombre del Paciente" required>
                <input type="date" required>
                <input type="time" required>
                <input type="text" placeholder="Motivo de consulta">
                <button type="button" class="btn-main" onclick="alert('Cita Agendada')">Confirmar Cita</button>
            </form>
        </div>
        <button class="btn-main" onclick="location.href='dashboard_medico.html'">Volver</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
